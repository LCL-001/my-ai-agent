server:
  servlet:
    session:
      cookie:
        secure: true
        same-site: lax

spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379
  session:
    store-type: redis
    redis:
      namespace: "yuai:session"
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}

search-api:
  api-key: ${SEARCH_API_KEY}

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

springdoc:
  api-docs:
    enabled: false

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: never
