spring:
  application:
    name: my-ai-agent
  profiles:
    active: local
  ai:
    dashscope:
      api-key: ${AI_DASHSCOPE_API_KEY}
      chat:
        options:
          model: qwen-plus-latest
          timeout: 60s
    vectorstore:
      pgvector:
        index-type: HNSW
        dimensions: 1024
        distance-type: COSINE_DISTANCE
        max-document-batch-size: 10000 # Optional: Maximum number of documents per batch
#    mcp:
#      client:
#        sse:
#          connections:
#            server1:
#              url: http://localhost:8127
        # stdio:
        # servers-configuration: classpath:mcp-servers.json


  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${MYSQL_URL:jdbc:mysql://localhost:3306/yu-ai-agent}
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:123456}
#    url: jdbc:postgresql://rm-cn-cq74sgsb50001ywo.rwlb.rds.aliyuncs.com/yu_ai_agent
#    username: your username
#    password: your password
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 20MB

  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1

app:
  knowledge:
    storage-dir: ${KNOWLEDGE_STORAGE_DIR:./data/knowledge}
  vector:
    enabled: ${VECTOR_ENABLED:false}
    datasource:
      jdbc-url: ${VECTOR_DB_URL:jdbc:postgresql://localhost:5432/yu_ai_agent_vector}
      username: ${VECTOR_DB_USERNAME:postgres}
      password: ${VECTOR_DB_PASSWORD:postgres}
      driver-class-name: org.postgresql.Driver

# springdoc-openapi????
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.lcl.myaiagent.controller
# knife4j???????????????
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: 接口文档
    version: 1.0
    group:
      test1:
        group-name: default
        api-rule: package
        api-rule-resources:
          - com.lcl.myaiagent.controller
server:
  port: 8123
  servlet:
    context-path: /api
    session:
      cookie:
        name: YUAI_SESSION
        path: /
      timeout: 7d

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
  endpoint:
    health:
      show-details: when-authorized

# application.yml
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: false
    # 仅在开发环境开启日志
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      logic-delete-field: isDelete # 全局逻辑删除的实体字段名
      logic-delete-value: 1 # 逻辑已删除值（默认为 1）
      logic-not-delete-value: 0 # 逻辑未删除值（默认为 0）
    enable-sql-runner: true
logging:
  level:
    org.springframework.ai: INFO
#kind: Application
